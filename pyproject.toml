[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "skypilot-admin-policy"
version = "0.1.0"
description = "SkyPilot admin policy: require workload-type Kubernetes pod toleration (SAP code)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28",
    "skypilot[aws,kubernetes]>=0.11.2",
]

[tool.setuptools]
py-modules = ["main"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# SkyPilot and transitive deps emit these at import time when tests load `main` → `sky`.
filterwarnings = [
    "ignore::sqlalchemy.exc.MovedIn20Warning",
    "ignore::DeprecationWarning:passlib",
]
